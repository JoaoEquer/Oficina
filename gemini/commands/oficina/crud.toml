description = "Generates a complete CRUD domain in the house pattern (Express + Prisma, multi-tenant) - Oficina harness"
prompt = """
Create the CRUD domain named in the user's command arguments, strictly following the Oficina harness (https://github.com/JoaoEquer/Oficina) - the express-prisma-pattern and prisma-schema-conventions skills. The project's AGENTS.md (context, locked decisions, PENDING items) is already in your context; obey it.

Mandatory steps, in this order:

1. Detect the stack: check the project's package.json. express present -> use express-prisma-pattern. @nestjs/core present instead -> stop and tell the user Oficina doesn't maintain a NestJS pattern today (no active Wibi backend runs NestJS); they can adapt express-prisma-pattern's principles by hand, or pull the retired nestjs-crud-pattern skill from an older commit if they want the literal Nest structure back. Neither present -> STOP and ask which pattern to follow; do not guess.
2. Locate the project's data model document (UML/diagram in docs/). If you can't find it or the entity isn't in it, STOP and ask for the fields - do not invent them.
3. If a CRUD module already exists in the repo, use it as the mold and keep the format identical: controller (HTTP only, zero business logic) -> usecase (business logic, depends on the repository ABSTRACTION, never on Prisma directly) -> repository (interface + Prisma implementation), wired by hand in a factory. No generic BaseRepository, no hexagonal ports/adapters, no speculative abstraction.
4. Model the entity in schema.prisma following the conventions (workspaceId on every entity, soft delete via deletedAt, UTC dates, idempotent recurrence / lineage versioning / audit queue where they apply) and generate the migration with a descriptive name.
5. Wire the feature: factory + route registration.
6. Validate: project boots, migration applied, all 5 routes respond (POST, GET list, GET by id, PATCH, DELETE), lint and build clean.
7. Write the delivery log in docs/log/ (what was done, decisions, pending items).
8. Self-verification (mandatory - do not skip): before declaring the domain done, print this checklist with an explicit pass/fail per item. If any item fails, fix it before finishing; if it cannot be fixed, report it as pending - never declare done with a silent failure.
   - Entity fields match the project's data model document (no invented fields)
   - Migration applied with a descriptive name (table exists)
   - Repository is an interface/abstract contract + Prisma implementation, never called directly by controller or business logic
   - workspaceId comes from the authenticated context; zero endpoints accept it in the body
   - Every repository query filters by workspaceId
   - Input validated as the first thing that runs (zod)
   - All 5 routes respond
   - Feature wired into the app; lint and build clean
   - Delivery log written in docs/log/
   - Any decision marked PENDING in AGENTS.md was flagged, not silently decided

Non-negotiable: workspaceId from the authenticated context (never from the body), every query filters by tenant, permissions validated on the server, dates in UTC.

Domain to build: {{args}}
"""
