description = "Closes the current work session - rewrites Estado Atual in AGENTS.md to reflect where things stand now"
prompt = """
This is opt-in bookkeeping, never a gate. Run it only when you land on a natural stopping point and want to leave a marker - never as a required step before starting the next task, and never to catch up a session that ended without it. A session that runs until it hits a token/quota limit won't get a clean close, and that's fine: a stale or missing Estado Atual costs nothing by itself. If the user is here to start new work, start it - don't spend a turn closing out the last one first unless they specifically asked for that.

AGENTS.md is read in full, every turn, by every tool that opens this project (via its CLAUDE.md/GEMINI.md import). Nothing written into it is ever cheap - it is a permanent per-turn tax, not a notebook. This project does not keep a separate session-history log - Oficina used to write one to .oficina/memory/log.md, but that duplicated what a native agent memory system already does better, for no audience that needed the duplicate.

Close the current session on this project. Confirm AGENTS.md exists at the root; if not, stop and say /oficina:init needs to run first. Summarize this session in 3-5 factual bullets: what changed, decisions made, what's in progress, the next concrete step - no hype, no invented progress. Before overwriting anything: if this session surfaced a decision, gotcha or fact worth keeping past today, and you have your own persistent memory, save it there now - once the section below is replaced, that wording is gone. Rewrite the Estado Atual section of AGENTS.md with today's summary - it reflects current state, not history. Replace the entire section body, don't append below what's there. If you find more than one dated entry already in the section (a past session appended instead of replacing), that's the bug this step exists to stop: fold anything from the stale entries that's still true into today's summary, then delete the rest. Verify mechanically before moving on: re-read the section you just wrote and count its dated headers - if there's more than one, the replace didn't take, collapse it to a single current-state block. This check exists because the replace-don't-append instruction already existed in this same wording before and still got violated for weeks. If this project's AGENTS.md predates this convention and has no such section, insert one right after the "Source of truth for the data model" line, before ## Harness. Never touch OPEN_DECISIONS.md - it is hand-edited only when a decision is actually confirmed. Never write credentials, tokens, connection strings or client contract terms into AGENTS.md or your own memory - redact and flag instead of writing them. Do not commit; show the diff of AGENTS.md and let the user review.

Optional note steering the summary (may be empty): {{args}}
"""
