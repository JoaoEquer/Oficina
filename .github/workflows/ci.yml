name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consistency check (skills, README, links, deny-list)
        run: node scripts/check.mjs
        env:
          # Optional repo secret: comma-separated private terms that must never appear in this public repo.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  install-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer smoke test
        run: node scripts/smoke-install.mjs
